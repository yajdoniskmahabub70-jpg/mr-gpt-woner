<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR GPT WONER - TEST MOD</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; overflow: hidden; }
        .chat-container { width: 100%; max-width: 700px; background: #111827; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 95vh; border: 1px solid #1f2937; }
        
        /* Header */
        .header { background: #1f2937; padding: 15px; text-align: center; border-bottom: 2px solid #374151; }
        .header h1 { margin: 0; color: #00d2ff; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .header p { margin: 5px 0 0; color: #f59e0b; font-weight: bold; font-size: 12px; letter-spacing: 3px; }

        /* API Section */
        .api-section { padding: 12px; background: #111827; border-bottom: 1px solid #1f2937; display: flex; gap: 8px; }
        .api-section input { flex: 1; padding: 10px; border: 1px solid #374151; border-radius: 6px; background: #030712; color: #fff; outline: none; }
        .api-section button { padding: 8px 18px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Chat Messages */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: #1f2937; color: #e5e7eb; border-bottom-left-radius: 2px; }

        /* Input Controls */
        .input-section { display: flex; border-top: 1px solid #1f2937; padding: 10px; gap: 8px; background: #111827; }
        .input-section input { flex: 1; padding: 12px; border: 1px solid #374151; border-radius: 6px; background: #030712; color: white; outline: none; }
        .btn-send { padding: 10px 18px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-mic { padding: 10px 14px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }

        /* Fullscreen Voice Animation Overlay */
        #voiceOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 18, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glowing-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #00d2ff;
            box-shadow: 0 0 20px #00d2ff, inset 0 0 20px #00d2ff;
            animation: pulseBlue 1.5s infinite alternate;
        }

        .overlay-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
        }

        .listening-text {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 16px;
            letter-spacing: 1px;
        }

        @keyframes pulseBlue {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 15px #00d2ff, inset 0 0 15px #00d2ff;
            }
            100% {
                transform: scale(1.15);
                box-shadow: 0 0 40px #00f0ff, 0 0 80px #00aaff, inset 0 0 30px #00f0ff;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>MR GPT WONER</h1>
        <p>TEST MOD</p>
    </div>

    <!-- API Section -->
    <div class="api-section">
        <input type="password" id="apiKey" placeholder="MR GPT API Key দিন...">
        <button onclick="saveKey()">Save</button>
    </div>

    <!-- Chat Messages (Updated English Welcome Message) -->
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">Hello! I am MR GPT. How can I help you today?</div>
    </div>

    <div class="input-section">
        <button class="btn-mic" onclick="startListening()" title="ভয়েসে কথা বলুন">🎤</button>
        <input type="text" id="userInput" placeholder="যেকোনো ভাষায় লিখুন বা বলুন..." onkeypress="handleKey(event)">
        <button class="btn-send" onclick="sendTextMessage()">Send</button>
    </div>
</div>

<!-- Voice Animation Screen -->
<div id="voiceOverlay">
    <div class="glowing-circle">
        <div class="overlay-title">MR GPT</div>
    </div>
    <div class="listening-text">Listening... Speak now</div>
</div>

<script>
    let geminiApiKey = "";

    function saveKey() {
        const key = document.getElementById("apiKey").value.trim();
        if (key) {
            geminiApiKey = key;
            alert("MR GPT API Key সফলভাবে সেট হয়েছে!");
        } else {
            alert("দয়া করে সঠিক Key দিন।");
        }
    }

    function handleKey(e) {
        if (e.key === "Enter") sendTextMessage();
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-message`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // AI Request
    async function processWithAI(message) {
        if (!geminiApiKey) {
            alert("প্রথমে উপরে MR GPT API Key দিয়ে Save করুন।");
            return;
        }

        appendMessage(message, "user");

        const systemPrompt = "You are MR GPT. Detect the language of the user's input automatically and respond fluently in that exact same language. You support all world languages.";
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ parts: [{ text: message }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                appendMessage(reply, "ai");
            } else {
                appendMessage("An error occurred. Please verify your API Key.", "ai");
            }
        } catch (error) {
            appendMessage("Connection error. Please check your internet connection.", "ai");
        }
    }

    function sendTextMessage() {
        const inputField = document.getElementById("userInput");
        const msg = inputField.value.trim();
        if (msg) {
            processWithAI(msg);
            inputField.value = "";
        }
    }

    // Voice Input & Fullscreen Animation
    function startListening() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে Voice Recognition কাজ করছে না। Google Chrome ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const overlay = document.getElementById("voiceOverlay");

        recognition.onstart = function() {
            overlay.style.display = "flex";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            overlay.style.display = "none";
            processWithAI(transcript);
        };

        recognition.onerror = function(event) {
            overlay.style.display = "none";
            alert("Voice Error: " + event.error);
        };

        recognition.onend = function() {
            overlay.style.display = "none";
        };

        recognition.start();
    }
</script>

</body>
</html>
